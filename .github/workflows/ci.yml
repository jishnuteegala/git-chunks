name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: v1.7.7
  ACTIONLINT_WINDOWS_AMD64_SHA256: 7f12f1801bca3d480d67aaf7774f4c2a6359a3ca8eebe382c95c10c9704aa731
  GOLANGCI_LINT_VERSION: v2.12.2
  GORELEASER_VERSION: v2.17.0

jobs:
  conventional-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate commit subjects
        uses: jishnuteegala/.github/actions/conventional-commits@a53b025e84d51283f4ac6ad79fb164a9e2a48b2a # v1

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting and module files
        run: |
          test -z "$(gofmt -l cmd internal)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: Test install scripts
        run: |
          install_dir=$(mktemp -d)
          INSTALL_DIR="$install_dir" sh scripts/install.sh v0.1.0
          "$install_dir/git-chunks" --version
          INSTALL_DIR="$install_dir" sh scripts/uninstall.sh
          test ! -e "$install_dir/git-chunks"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test and build
        run: |
          go vet ./...
          go test ./...
          go build ./cmd/git-chunks

  release-checks:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test release scripts
        run: |
          node --test scripts/*.test.mjs
          bash -n scripts/install.sh scripts/uninstall.sh
      - name: Validate workflows
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo actionlint.zip "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_windows_amd64.zip"
          echo "${ACTIONLINT_WINDOWS_AMD64_SHA256}  actionlint.zip" | sha256sum --check
          unzip -q actionlint.zip actionlint.exe
          actionlint="$PWD/actionlint.exe"
          cd "$GITHUB_WORKSPACE"
          "$actionlint"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true
      - name: Validate GoReleaser configuration
        run: goreleaser check
      - name: Build and verify release snapshot
        run: |
          goreleaser release --snapshot --clean --skip=chocolatey
          VERSION=$(node -e 'const m=require("./dist/metadata.json"); process.stdout.write(m.version)')
          node scripts/verify-artifacts.mjs dist/artifacts.json "$VERSION"
          bash scripts/publish-npm.sh "$VERSION" --dry-run
          powershell.exe -NoProfile -File scripts/package-chocolatey.ps1 -Version "$VERSION"
      - name: Verify generated checks do not modify source
        run: git diff --exit-code

  ci-ok:
    needs: [conventional-commits, quality, test, release-checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
